<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2D9B6E" />
    <meta name="description" content="目標追蹤與日曆管理" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MyCal" />
    <title>MyCal</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
  </head>
  <body>
    <!-- 登入頁面 -->
    <div id="loginPage" class="page">
      <div class="login-container">
        <h1>MyCal</h1>
        <div class="login-form">
          <input
            type="tel"
            id="phoneInput"
            placeholder="手機號碼"
            maxlength="10"
          />
          <input type="password" id="passwordInput" placeholder="密碼" />
          <button id="loginBtn">登入</button>
          <p id="loginError" class="error-msg"></p>
        </div>
      </div>
    </div>

    <!-- 主頁面 -->
    <div id="mainPage" class="page hidden">
      <!-- 頂部導覽 -->
      <header class="header">
        <div class="header-left">
          <button id="sidebarToggle" class="icon-btn" title="顯示／隱藏側邊欄">☰</button>
          <span class="brand">MyCal</span>
          <div class="month-nav">
            <button id="todayBtn" class="today-btn">今天</button>
            <button id="prevMonthBtn" class="nav-arrow" title="上月">&lsaquo;</button>
            <button id="nextMonthBtn" class="nav-arrow" title="下月">&rsaquo;</button>
            <h2 id="calendarTitle"></h2>
          </div>
        </div>
        <div class="header-right">
          <div class="nav-dropdown">
            <button id="yearGoalsNavBtn" class="nav-btn">
              🎯 <span class="nav-btn-text">年度目標</span>
            </button>
            <div id="yearGoalsPanel" class="nav-panel hidden">
              <h4 id="yearGoalsPanelTitle">🎯 年度目標</h4>
              <div id="yearGoalsList" class="year-goals-list"></div>
              <div class="year-goal-input-area">
                <input
                  type="text"
                  id="yearGoalInput"
                  placeholder="輸入年度目標..."
                />
                <div class="color-picker">
                  <span class="color-label">顏色：</span>
                  <div class="color-options" id="yearGoalColorPicker"></div>
                </div>
                <button id="addYearGoalBtn">新增</button>
              </div>
            </div>
          </div>

          <div class="nav-dropdown">
            <button id="progressNavBtn" class="nav-btn progress-chip">
              📊 <span id="progressRate">0%</span>
            </button>
            <div id="progressPanel" class="nav-panel hidden">
              <h4>📊 本月達成率</h4>
              <div class="progress-bar">
                <div id="progressBarFill" class="progress-bar-fill"></div>
              </div>
              <p id="progressDetail" class="progress-detail"></p>
            </div>
          </div>

          <button id="weekPanelBtn" class="icon-btn week-toggle-btn" title="顯示／隱藏週目標欄">
            週
          </button>

          <div class="nav-dropdown">
            <button id="moreNavBtn" class="nav-btn" title="更多">⋯</button>
            <div id="moreMenu" class="nav-panel nav-menu hidden">
              <span id="currentUserDisplay" class="menu-user"></span>
              <button id="viewStatsBtn">📊 統計總覽</button>
              <button id="changePasswordBtn">🔑 修改密碼</button>
              <button id="deleteAllMonthItemsBtn" class="menu-danger">
                🗑 刪除當月項目…
              </button>
              <button id="logoutBtn">↩ 登出</button>
            </div>
          </div>
        </div>
      </header>

      <div class="app-body">
        <!-- 左側欄 -->
        <aside id="sidebar" class="sidebar">
         <div class="sidebar-inner">
          <section class="sidebar-block">
            <h3 id="monthGoalTitle">📅 月目標</h3>
            <div id="monthGoalsList" class="goal-items-list"></div>
            <div class="month-goal-input-area">
              <input
                type="text"
                id="monthGoalInput"
                placeholder="輸入本月目標..."
              />
              <div class="color-picker">
                <div class="color-options" id="monthGoalColorPicker"></div>
              </div>
              <button id="addMonthGoalBtn">新增</button>
            </div>
          </section>

          <section class="sidebar-block">
            <h3>🎨 顏色主題</h3>
            <p class="sidebar-hint">取消勾選可隱藏該顏色，點名稱可改主題</p>
            <div id="colorThemeList" class="color-theme-list"></div>
          </section>
         </div>
        </aside>
        <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

        <!-- 月曆區 -->
        <main class="calendar-section">
          <div class="calendar-weekdays">
            <div>日</div>
            <div>一</div>
            <div>二</div>
            <div>三</div>
            <div>四</div>
            <div>五</div>
            <div>六</div>
          </div>
          <div id="calendarGrid" class="calendar-grid"></div>
        </main>

        <!-- 週目標欄 -->
        <aside id="weekPanel" class="week-panel">
          <div class="week-panel-inner">
            <div class="week-panel-header">
              <h3>📆 週目標</h3>
              <button
                id="closeWeekPanelBtn"
                class="icon-btn"
                title="隱藏週目標欄"
              >
                &times;
              </button>
            </div>
            <div id="weekPanelBody" class="week-list"></div>
          </div>
        </aside>
      </div>

      <!-- 每日項目彈窗 -->
      <div id="dailyModal" class="modal hidden">
        <div class="modal-content modal-large">
          <span class="modal-close" id="closeModal">&times;</span>
          <h3 id="modalDate"></h3>
          <div class="modal-body">
            <!-- 現有項目列表 -->
            <div id="itemsList" class="items-list"></div>

            <!-- 新增項目區 -->
            <div class="add-item-section">
              <input
                type="text"
                id="newItemInput"
                placeholder="輸入新項目..."
              />
              <div class="color-picker">
                <span class="color-label">顏色：</span>
                <div class="color-options" id="newItemColorPicker"></div>
              </div>
              <button id="addItemBtn">新增</button>
              <button id="addAndApplyBtn" class="btn-secondary">新增並套用到多天…</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 套用範圍彈窗 -->
      <div id="applyScopeModal" class="modal hidden">
        <div class="modal-content">
          <span class="modal-close" id="closeApplyScopeModal">&times;</span>
          <h3>套用範圍</h3>
          <div class="modal-body">
            <p id="applyScopeTarget" class="apply-scope-target"></p>

            <div class="apply-preset-group" id="applyPresetGroup">
              <button class="apply-preset" data-preset="all">整月</button>
              <button class="apply-preset" data-preset="weekday">平日</button>
              <button class="apply-preset" data-preset="weekend">假日</button>
              <button class="apply-preset" data-preset="custom">自訂</button>
            </div>

            <div class="weekday-picker" id="weekdayPicker"></div>

            <p id="applyScopePreview" class="apply-scope-preview"></p>

            <button id="confirmApplyScopeBtn">確定套用</button>
          </div>
        </div>
      </div>

      <!-- 週目標彈窗 -->
      <div id="weekGoalModal" class="modal hidden">
        <div class="modal-content">
          <span class="modal-close" id="closeWeekGoalModal">&times;</span>
          <h3 id="weekGoalModalTitle">新增週目標</h3>
          <div class="modal-body">
            <p id="weekGoalModalRange" class="apply-scope-target"></p>
            <input type="text" id="weekGoalInput" placeholder="輸入週目標..." />
            <div class="color-picker">
              <span class="color-label">顏色：</span>
              <div class="color-options" id="weekGoalColorPicker"></div>
            </div>
            <button id="saveWeekGoalBtn">儲存</button>
          </div>
        </div>
      </div>

      <!-- 刪除範圍彈窗 -->
      <div id="deleteScopeModal" class="modal hidden">
        <div class="modal-content">
          <span class="modal-close" id="closeDeleteScopeModal">&times;</span>
          <h3 id="deleteScopeTitle">刪除當月項目</h3>
          <div class="modal-body">
            <label>刪除哪個項目</label>
            <select id="deleteTargetSelect" class="scope-select"></select>

            <label>刪除哪些日子</label>
            <div class="apply-preset-group" id="deletePresetGroup">
              <button class="apply-preset" data-preset="all">整月</button>
              <button class="apply-preset" data-preset="weekday">平日</button>
              <button class="apply-preset" data-preset="weekend">假日</button>
              <button class="apply-preset" data-preset="custom">自訂</button>
            </div>
            <div class="weekday-picker" id="deleteWeekdayPicker"></div>

            <p id="deleteScopePreview" class="apply-scope-preview"></p>

            <button id="confirmDeleteScopeBtn">確定刪除</button>
          </div>
        </div>
      </div>

      <!-- 編輯項目彈窗 -->
      <div id="editItemModal" class="modal hidden">
        <div class="modal-content">
          <span class="modal-close" id="closeEditModal">&times;</span>
          <h3>編輯項目</h3>
          <div class="modal-body">
            <input
              type="text"
              id="editItemInput"
              placeholder="項目名稱..."
            />
            <div class="color-picker">
              <span class="color-label">顏色：</span>
              <div class="color-options" id="editItemColorPicker"></div>
            </div>
            <div class="edit-buttons">
              <button id="saveEditBtn">儲存</button>
              <button id="saveAndApplyEditBtn" class="btn-secondary">修改並套用到全月</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 編輯月目標彈窗 -->
      <div id="editMonthGoalModal" class="modal hidden">
        <div class="modal-content">
          <span class="modal-close" id="closeEditMonthGoalModal">&times;</span>
          <h3>編輯月目標</h3>
          <div class="modal-body">
            <input
              type="text"
              id="editMonthGoalInput"
              placeholder="月目標..."
            />
            <div class="color-picker">
              <span class="color-label">顏色：</span>
              <div class="color-options" id="editMonthGoalColorPicker"></div>
            </div>
            <button id="saveEditMonthGoalBtn">儲存</button>
          </div>
        </div>
      </div>

      <!-- 編輯年度目標彈窗 -->
      <div id="editYearGoalModal" class="modal hidden">
        <div class="modal-content">
          <span class="modal-close" id="closeEditYearGoalModal">&times;</span>
          <h3>編輯年度目標</h3>
          <div class="modal-body">
            <input
              type="text"
              id="editYearGoalInput"
              placeholder="年度目標..."
            />
            <div class="color-picker">
              <span class="color-label">顏色：</span>
              <div class="color-options" id="editYearGoalColorPicker"></div>
            </div>
            <button id="saveEditYearGoalBtn">儲存</button>
          </div>
        </div>
      </div>

      <!-- 統計總覽彈窗 -->
      <div id="statsModal" class="modal hidden">
        <div class="modal-content modal-stats">
          <span class="modal-close" id="closeStatsModal">&times;</span>
          <h3 id="statsTitle">📊 統計總覽</h3>
          <div class="stats-view-toggle">
            <button id="statsGridViewBtn" class="view-btn active">📋 格狀</button>
            <button id="statsChartViewBtn" class="view-btn">📈 圖表</button>
          </div>
          <div class="modal-body">
            <div id="statsContent" class="stats-content">
              <p class="loading-text">載入中...</p>
            </div>
          </div>
        </div>
      </div>

      <!-- 修改密碼彈窗 -->
      <div id="passwordModal" class="modal hidden">
        <div class="modal-content">
          <span class="modal-close" id="closePasswordModal">&times;</span>
          <h3>修改密碼</h3>
          <div class="modal-body">
            <label>目前密碼：</label>
            <input
              type="password"
              id="currentPasswordInput"
              placeholder="輸入目前密碼"
            />
            <label>新密碼：</label>
            <input
              type="password"
              id="newPasswordInput"
              placeholder="輸入新密碼"
            />
            <label>確認新密碼：</label>
            <input
              type="password"
              id="confirmPasswordInput"
              placeholder="再次輸入新密碼"
            />
            <p id="passwordError" class="error-msg"></p>
            <button id="savePasswordBtn">儲存密碼</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    </script>
  </body>
</html>
